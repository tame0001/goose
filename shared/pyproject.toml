[project]
name = "goose-shared"
version = "0.1.0"
description = "Shared schemas and contracts for Goose application"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
