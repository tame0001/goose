[project]
name = "goose-tui"
version = "0.1.0"
description = "Goose Textual TUI client"
requires-python = ">=3.12"
dependencies = [
    "goose-shared",
    "textual~=8.2.0",
    "httpx~=0.28.0",
]

[tool.uv.sources]
goose-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
